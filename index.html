<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trái Tim ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<script>

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


/* =========================
   CẤU HÌNH
========================= */

const COUNT = 3500;

let particles = [];


/* =========================
   RANDOM
========================= */

function random(min, max) {
    return Math.random() * (max - min) + min;
}


/* =========================
   TẠO HẠT TRÁI TIM
========================= */

function createHeart() {

    particles = [];

    for (let i = 0; i < COUNT; i++) {

        const t = Math.random() * Math.PI * 2;

        const x =
            16 * Math.pow(Math.sin(t), 3);

        const y =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );

        /*
        Phân bố hạt bên trong trái tim
        */

        const scale =
            Math.sqrt(random(0.05, 1.05));

        particles.push({

            x: x * scale,

            y: y * scale,

            size: random(0.7, 2.8),

            opacity: random(0.3, 1),

            speed: random(0.5, 2),

            phase: random(0, Math.PI * 2),

            drift: random(0.1, 0.7)

        });
    }
}

createHeart();


/* =========================
   ANIMATION
========================= */

let time = 0;

function animate() {

    time += 0.025;

    /*
    Xóa màn hình
    */

    ctx.fillStyle = "black";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
    HIỆU ỨNG TIM ĐẬP
    */

    const beat =
        1 +
        Math.max(
            0,
            Math.sin(time * 3)
        ) * 0.07;


    /*
    Kích thước trái tim
    */

    const scale =
        Math.min(W, H) / 34;


    const centerX = W / 2;

    const centerY = H / 2;


    /*
    Vẽ từng hạt
    */

    for (const p of particles) {

        /*
        Hạt chuyển động nhẹ
        */

        const movement =
            Math.sin(
                time * p.speed +
                p.phase
            );


        const x =
            centerX +
            p.x *
            scale *
            beat +
            movement *
            p.drift;


        const y =
            centerY +
            p.y *
            scale *
            beat +
            movement *
            p.drift;


        /*
        Hạt nhấp nháy
        */

        const alpha =
            p.opacity *
            (
                0.55 +
                0.45 *
                Math.sin(
                    time * p.speed +
                    p.phase
                )
            );


        /*
        Màu hồng
        */

        ctx.fillStyle =
            `rgba(255, 55, 145, ${alpha})`;


        /*
        Ánh sáng
        */

        ctx.shadowBlur = 7;

        ctx.shadowColor =
            "#ff1493";


        /*
        Vẽ hạt
        */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.shadowBlur = 0;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
