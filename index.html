<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    width: 100vw;
    height: 100vh;
    display: block;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

let particles = [];

const PARTICLE_COUNT = 3000;


/* =========================
   KÍCH THƯỚC
========================= */

function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);


/* =========================
   RANDOM
========================= */

function random(min, max) {

    return Math.random() * (max - min) + min;

}


/* =========================
   TẠO TRÁI TIM
========================= */

function createParticles() {

    particles = [];

    for (let i = 0; i < PARTICLE_COUNT; i++) {

        /*
        Tham số trái tim
        */

        const t =
            Math.random() *
            Math.PI * 2;


        /*
        Công thức trái tim
        */

        const x =
            16 *
            Math.pow(Math.sin(t), 3);


        const y =
            -(
                13 * Math.cos(t)
                - 5 * Math.cos(2 * t)
                - 2 * Math.cos(3 * t)
                - Math.cos(4 * t)
            );


        /*
        Làm hạt phân bố quanh đường tim
        */

        const spread =
            random(0.82, 1.08);


        const px =
            x * spread;


        const py =
            y * spread;


        particles.push({

            x: px,

            y: py,

            size: random(0.6, 2.5),

            alpha: random(0.2, 1),

            speed: random(0.5, 2),

            phase: random(0, Math.PI * 2),

            drift: random(0.1, 0.5)

        });

    }

}

createParticles();


/* =========================
   VẼ
========================= */

let time = 0;


function animate() {

    time += 0.02;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    Nền đen
    */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /*
    NHỊP ĐẬP
    */

    const heartbeat =
        1 +
        Math.max(
            0,
            Math.sin(time * 3)
        ) * 0.06;


    /*
    Kích thước tim
    */

    const scale =
        Math.min(width, height) / 34;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    /*
    Vẽ từng hạt
    */

    for (const p of particles) {


        /*
        Hạt rung nhẹ
        */

        const wave =
            Math.sin(
                time * p.speed +
                p.phase
            );


        const x =
            centerX +
            p.x *
            scale *
            heartbeat +
            wave *
            p.drift;


        const y =
            centerY +
            p.y *
            scale *
            heartbeat +
            wave *
            p.drift;


        /*
        Hạt nhấp nháy
        */

        const alpha =
            p.alpha *
            (
                0.55 +
                0.45 *
                Math.sin(
                    time * p.speed +
                    p.phase
                )
            );


        /*
        Màu hồng
        */

        ctx.fillStyle =
            `rgba(255, 55, 145, ${alpha})`;


        /*
        Glow
        */

        ctx.shadowBlur =
            random(3, 9);


        ctx.shadowColor =
            "#ff1493";


        /*
        Vẽ hạt
        */

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
    Reset shadow
    */

    ctx.shadowBlur = 0;


    requestAnimationFrame(animate);

}


animate();

</script>

</body>
</html>
