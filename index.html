<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trái Tim ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #heart {
        position: relative;
        width: min(90vw, 600px);
        height: min(90vw, 600px);
        animation: heartbeat 1.4s ease-in-out infinite;
    }

    .particle {
        position: absolute;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #ff4d9d;
        box-shadow:
            0 0 5px #ff4d9d,
            0 0 10px #ff1493;
        pointer-events: none;
    }

    @keyframes heartbeat {
        0%, 100% {
            transform: scale(1);
        }

        15% {
            transform: scale(1.08);
        }

        30% {
            transform: scale(1);
        }

        45% {
            transform: scale(1.08);
        }

        60% {
            transform: scale(1);
        }
    }
</style>
</head>

<body>

<div id="heart"></div>

<script>
const heart = document.getElementById("heart");

const particleCount = 2500;

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function createHeart() {

    const width = heart.clientWidth;
    const height = heart.clientHeight;

    for (let i = 0; i < particleCount; i++) {

        // Công thức tạo hình trái tim
        const t = Math.random() * Math.PI * 2;

        const x =
            16 * Math.pow(Math.sin(t), 3);

        const y =
            -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t));

        // Phân bố hạt vào bên trong trái tim
        const scale = random(0.65, 1.35);

        const px = x * scale;
        const py = y * scale;

        const particle = document.createElement("div");

        particle.className = "particle";

        const centerX = width / 2;
        const centerY = height / 2;

        const heartSize = Math.min(width, height) / 32;

        particle.style.left =
            centerX + px * heartSize + "px";

        particle.style.top =
            centerY + py * heartSize + "px";

        // Kích thước hạt ngẫu nhiên
        const size = random(1, 4);

        particle.style.width = size + "px";
        particle.style.height = size + "px";

        // Độ sáng ngẫu nhiên
        particle.style.opacity =
            random(0.35, 1);

        heart.appendChild(particle);
    }
}

createHeart();
</script>

</body>
</html>
